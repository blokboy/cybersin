[package]
name = "cybersin-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "The idempotent tool gateway (spec §8.2): schema validation, the tool_calls idempotency ledger, retry classes, dead-letter queue, and approval gates."

[dependencies]
cybersin-adapter = { path = "../cybersin-adapter", version = "0.1.0" }
cybersin-runtime = { path = "../cybersin-runtime", version = "0.1.0" }

async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
cybersin-router = { path = "../cybersin-router", version = "0.1.0" }
cybersin-trace = { path = "../cybersin-trace", version = "0.1.0" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
