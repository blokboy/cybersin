[package]
name = "cybersin-cli"
version.workspace = true
edition.workspace = true
description = "The `cybersin` binary: compiler/runtime commands and ratatui explain/control-room views."

[[bin]]
name = "cybersin"
path = "src/main.rs"

# Test-support binary only (issue #37): a minimal gRPC-speaking harness
# used by tests/run_live_grpc.rs to exercise `cybersin run`'s
# `harness.adapter: grpc` path end-to-end without needing a Python gRPC
# client in this repo. Not part of the `cybersin` product surface.
[[bin]]
name = "grpc_stub_harness"
path = "src/bin/grpc_stub_harness.rs"

# Reusable, transport-agnostic scripted harness (issue #41): drives any
# compiled agent's live session from a YAML script instead of a bespoke
# per-agent program. The TUI's generated prompt agents use this binary.
[[bin]]
name = "scripted_harness"
path = "src/bin/scripted_harness.rs"

[dependencies]
cybersin-frontend = { path = "../cybersin-frontend" }
cybersin-adapter = { path = "../cybersin-adapter" }
cybersin-backends = { path = "../cybersin-backends" }
cybersin-gateway = { path = "../cybersin-gateway" }
cybersin-ir = { path = "../cybersin-ir" }
cybersin-passes = { path = "../cybersin-passes" }
cybersin-router = { path = "../cybersin-router" }
cybersin-runtime = { path = "../cybersin-runtime" }
cybersin-sandbox = { path = "../cybersin-sandbox" }
cybersin-trace = { path = "../cybersin-trace" }

anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
dotenvy = "0.15"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "time"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
wiremock = "0.6"
