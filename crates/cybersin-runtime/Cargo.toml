[package]
name = "cybersin-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "cybersind daemon skeleton (spec §8): Storage trait + SQLite impl, event-sourced session loop, stub agent driven against a hand-written dist/ fixture, recording real spans into cybersin-trace."

[dependencies]
cybersin-adapter = { path = "../cybersin-adapter", version = "0.1.0" }
cybersin-backends = { path = "../cybersin-backends", version = "0.1.0" }
cybersin-ir = { path = "../cybersin-ir", version = "0.1.0" }
cybersin-router = { path = "../cybersin-router", version = "0.1.0" }
cybersin-sandbox = { path = "../cybersin-sandbox", version = "0.1.0" }
cybersin-trace = { path = "../cybersin-trace", version = "0.1.0" }

async-trait = "0.1"
minijinja = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = [
    "postgres",
    "sqlite",
    "runtime-tokio",
    "macros",
] }
thiserror = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util"] }
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
